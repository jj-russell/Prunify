{% extends "base.html" %} 
    {% block styles %}
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='select_playlist.css') }}"
    />
    {% endblock %}

    {% block main_content %} 
        <div class="swiper">
            <div class="swiper-wrapper">
                {% for playlist in playlists %}
                <div class="swiper-slide">
                <div class="playlist-card">
                    <a href="{{ url_for('track_swipe', playlist_id=playlist['id']) }}">
                        <img src="{{ playlist['images'][0]['url'] }}" />
                    </a>
                    <h3>{{ playlist["name"] }}</h3>
                </div>
                </div>
                {% endfor %}
            </div>

            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    {% endblock %}

    <{% block scripts %}
        <script src="{{ url_for('static', filename='carousel.js') }}"></script> 
    {% endblock %}
